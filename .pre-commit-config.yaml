repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: ruff check
        language: system
        types: [python]
      - id: django-check
        name: Django system check
        entry: python manage.py check
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest-coverage
        name: Pytest and coverage report
        entry: pytest --cov=config --cov=users --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml
        language: system
        pass_filenames: false
        always_run: true
